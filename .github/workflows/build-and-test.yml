# This workflow builds and tests the CLIF application on Windows
# CLIF is a Windows-specific WPF UI automation tool that requires Windows to build and run
name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore locked dependency graph
      run: dotnet restore clif.sln --locked-mode

    - name: Fail on known vulnerable packages
      shell: pwsh
      run: |
        $audit = dotnet list clif.sln package --vulnerable --include-transitive 2>&1 | Out-String
        Write-Host $audit
        if ($LASTEXITCODE -ne 0) {
          throw "The dependency vulnerability audit command failed."
        }
        if ($audit -match '(?m)^\s*>.*\s+(Low|Moderate|High|Critical)\s+') {
          throw "Known vulnerable NuGet packages were found."
        }

  build:
    name: Build Solution
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Display .NET info
      run: |
        dotnet --version
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Publish CLIF CLI
      run: dotnet publish CLIF/CLIF.csproj --configuration Release --output ./publish --no-restore --no-build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: clif-cli
        path: ./publish/
        if-no-files-found: error
        retention-days: 30

    - name: Upload TestWpfApp artifact
      uses: actions/upload-artifact@v6
      with:
        name: test-wpf-app
        path: TestWpfApp/bin/Release/net8.0-windows/
        if-no-files-found: error
        retention-days: 30

  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run unit tests with coverage
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "FullyQualifiedName~Unit&Category!=SkipValidationMismatch" `
          --logger "trx;LogFileName=unit-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Run MCP unit tests
      run: |
        dotnet test CLIF.Mcp.Tests/CLIF.Mcp.Tests.csproj --configuration Release --no-build `
          --logger "trx;LogFileName=mcp-unit-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Upload unit test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: unit-test-results
        path: |
          ./TestResults/*.trx
          ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: error
        retention-days: 30

    - name: Generate unit test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Unit Test Results
        path: ./TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run integration tests
      id: integration-tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "Category=Integration" `
          --logger "trx;LogFileName=integration-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Upload integration test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: integration-test-results
        path: |
          ./TestResults/*.trx
          ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: error
        retention-days: 30

    - name: Generate integration test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Integration Test Results
        path: ./TestResults/integration-tests.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Integration test outcome summary
      if: success()
      shell: pwsh
      run: Write-Host "Integration tests passed successfully."

  # ────────────────────────────────────────────────────────────────────────────
  # Cross-platform fixture build
  # Builds the Avalonia fixture on all supported desktop runner families. This
  # verifies that the portable test surface remains portable even though CLIF's
  # current FlaUI backend and WPF fixture remain Windows-specific.
  # ────────────────────────────────────────────────────────────────────────────
  cross-platform-fixture:
    name: Cross-platform fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore cross-platform fixture
      run: dotnet restore TestCrossPlatformApp/TestCrossPlatformApp.csproj --locked-mode

    - name: Build cross-platform fixture
      run: dotnet build TestCrossPlatformApp/TestCrossPlatformApp.csproj --configuration Release --no-restore

    - name: Restore fixture contract tests
      run: dotnet restore TestCrossPlatformApp.Tests/TestCrossPlatformApp.Tests.csproj --locked-mode

    - name: Run fixture contract tests
      run: dotnet test TestCrossPlatformApp.Tests/TestCrossPlatformApp.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=minimal"

  # Exercises the Avalonia fixture through the same Windows UI Automation path
  # currently used by CLIF. This validates the portable fixture against the
  # existing FlaUI/UIA3 backend without mixing it with the legacy WPF fixture.
  cross-platform-ui-tests:
    name: Cross-platform fixture UI tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Verify Avalonia fixture executable
      shell: pwsh
      run: |
        $fixturePath = Join-Path $env:GITHUB_WORKSPACE 'TestCrossPlatformApp\bin\Release\net8.0\TestCrossPlatformApp.exe'
        if (-not (Test-Path -LiteralPath $fixturePath -PathType Leaf)) {
          throw "Expected Avalonia fixture executable was not produced: $fixturePath"
        }
        "TEST_CROSS_PLATFORM_APP_PATH=$fixturePath" >> $env:GITHUB_ENV
        Write-Host "Fixture executable: $fixturePath"

    - name: Run cross-platform fixture UI tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "Category=CrossPlatformUI" `
          --logger "trx;LogFileName=cross-platform-ui-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults

    - name: Assert Windows UI validation executed
      if: always()
      shell: pwsh
      run: |
        $trxPath = Join-Path $env:GITHUB_WORKSPACE 'TestResults\cross-platform-ui-tests.trx'
        if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
          throw "Cross-platform UI test results were not produced: $trxPath"
        }

        [xml]$trx = Get-Content -LiteralPath $trxPath
        $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
        $failed = @($results | Where-Object { $_.outcome -in @('Failed', 'Error') }).Count
        $notExecuted = @($results | Where-Object { $_.outcome -eq 'NotExecuted' }).Count

        Write-Host "Windows UI tests recorded: $($results.Count)"
        Write-Host "Failed: $failed"
        Write-Host "Not executed: $notExecuted"

        if ($results.Count -eq 0) {
          throw "No Windows UI test results were recorded."
        }
        if ($failed -gt 0 -or $notExecuted -gt 0) {
          throw "Windows UI validation failed or was skipped."
        }

    - name: Upload cross-platform UI test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: cross-platform-ui-test-results
        path: ./TestResults/*.trx
        if-no-files-found: error
        retention-days: 30

    - name: Generate cross-platform UI test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Cross-platform UI Test Results
        path: ./TestResults/cross-platform-ui-tests.trx
        reporter: dotnet-trx
        fail-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # WPF UI Tests
  # Launches TestWpfApp.exe and exercises it end-to-end via FlaUI / UIA3.
  # windows-latest runners provide a full interactive desktop session so WPF
  # windows and UI Automation are available. This is a required validation gate:
  # failures and skipped tests fail the workflow rather than producing a misleading
  # green build for the primary WPF product surface.
  # ────────────────────────────────────────────────────────────────────────────
  wpf-ui-tests:
    name: WPF UI Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run WPF UI tests
      id: wpf-ui-tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "Category=WpfUI" `
          --logger "trx;LogFileName=wpf-ui-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults

    - name: Upload WPF UI test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: wpf-ui-test-results
        path: ./TestResults/*.trx
        if-no-files-found: error
        retention-days: 30

    - name: Generate WPF UI test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: WPF UI Test Results
        path: ./TestResults/wpf-ui-tests.trx
        reporter: dotnet-trx
        fail-on-error: true

    - name: Assert WPF UI validation executed
      if: always()
      shell: pwsh
      run: |
        $trxPath = Join-Path $env:GITHUB_WORKSPACE 'TestResults\wpf-ui-tests.trx'
        if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
          throw "WPF UI test results were not produced: $trxPath"
        }

        [xml]$trx = Get-Content -LiteralPath $trxPath
        $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
        $failed = @($results | Where-Object { $_.outcome -in @('Failed', 'Error') }).Count
        $notExecuted = @($results | Where-Object { $_.outcome -eq 'NotExecuted' }).Count

        Write-Host "WPF UI tests recorded: $($results.Count)"
        Write-Host "Failed: $failed"
        Write-Host "Not executed: $notExecuted"

        if ($results.Count -eq 0) {
          throw "No WPF UI test results were recorded."
        }
        if ($failed -gt 0 -or $notExecuted -gt 0) {
          throw "WPF UI validation failed or was skipped."
        }

  # Exercises the released MCP executable as a separate process over stdio against
  # TestWpfApp. This prevents unit-only protocol coverage from masking a broken
  # production server, allowlist, or UI Automation integration.
  mcp-ui-tests:
    name: MCP WPF End-to-End Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.424'

    - name: Restore dependencies
      run: dotnet restore clif.sln --locked-mode

    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Configure MCP UI test executables
      shell: pwsh
      run: |
        $mcpPath = Join-Path $env:GITHUB_WORKSPACE 'CLIF.Mcp\bin\Release\net8.0-windows\CLIF.Mcp.exe'
        $wpfPath = Join-Path $env:GITHUB_WORKSPACE 'TestWpfApp\bin\Release\net8.0-windows\TestWpfApp.exe'
        foreach ($path in @($mcpPath, $wpfPath)) {
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Expected executable was not produced: $path"
          }
        }
        "CLIF_MCP_EXE_PATH=$mcpPath" >> $env:GITHUB_ENV
        "TEST_WPF_APP_PATH=$wpfPath" >> $env:GITHUB_ENV

    - name: Run MCP WPF end-to-end tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "Category=McpUI" `
          --logger "trx;LogFileName=mcp-ui-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults

    - name: Assert MCP UI validation executed
      if: always()
      shell: pwsh
      run: |
        $trxPath = Join-Path $env:GITHUB_WORKSPACE 'TestResults\mcp-ui-tests.trx'
        if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
          throw "MCP UI test results were not produced: $trxPath"
        }

        [xml]$trx = Get-Content -LiteralPath $trxPath
        $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
        $failed = @($results | Where-Object { $_.outcome -in @('Failed', 'Error') }).Count
        $notExecuted = @($results | Where-Object { $_.outcome -eq 'NotExecuted' }).Count

        Write-Host "MCP UI tests recorded: $($results.Count)"
        Write-Host "Failed: $failed"
        Write-Host "Not executed: $notExecuted"

        if ($results.Count -eq 0) {
          throw "No MCP UI test results were recorded."
        }
        if ($failed -gt 0 -or $notExecuted -gt 0) {
          throw "MCP UI validation failed or was skipped."
        }

    - name: Upload MCP UI test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: mcp-ui-test-results
        path: ./TestResults/*.trx
        if-no-files-found: error
        retention-days: 30

    - name: Generate MCP UI test report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: MCP UI Test Results
        path: ./TestResults/mcp-ui-tests.trx
        reporter: dotnet-trx
        fail-on-error: true
