# This workflow builds and tests the CLIF application on Windows
# CLIF is a Windows-specific WPF UI automation tool that requires Windows to build and run
name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Display .NET version
      run: dotnet --version
      
    - name: Restore dependencies
      run: dotnet restore clif.sln
      
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore
      
    - name: Run unit tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "FullyQualifiedName~Unit" `
          --logger "trx;LogFileName=unit-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults
      
    - name: Run integration tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "FullyQualifiedName~Integration" `
          --logger "trx;LogFileName=integration-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults
      continue-on-error: true
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults/*.trx
        retention-days: 30
        
    - name: Build CLIF CLI
      run: dotnet publish CLIF/CLIF.csproj --configuration Release --output ./publish --no-restore --no-build
      if: success()
      
    - name: Build TestWpfApp
      run: dotnet build TestWpfApp/TestWpfApp.csproj --configuration Release --no-restore
      if: success()
      
    - name: Upload CLIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clif-cli
        path: ./publish/
        retention-days: 30
        
    - name: Upload TestWpfApp artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-wpf-app
        path: TestWpfApp/bin/Release/net8.0-windows/
        retention-days: 30
