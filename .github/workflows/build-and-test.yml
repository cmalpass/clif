# This workflow builds and tests the CLIF application on Windows
# CLIF is a Windows-specific WPF UI automation tool that requires Windows to build and run
name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Solution
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Display .NET info
      run: |
        dotnet --version
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Restore dependencies
      run: dotnet restore clif.sln

    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Publish CLIF CLI
      run: dotnet publish CLIF/CLIF.csproj --configuration Release --output ./publish --no-restore --no-build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: clif-cli
        path: ./publish/
        retention-days: 30

    - name: Upload TestWpfApp artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-wpf-app
        path: TestWpfApp/bin/Release/net8.0-windows/
        retention-days: 30

  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore clif.sln

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run unit tests with coverage
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "FullyQualifiedName~Unit&Category!=SkipValidationMismatch" `
          --logger "trx;LogFileName=unit-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Run MCP unit tests
      run: |
        dotnet test CLIF.Mcp.Tests/CLIF.Mcp.Tests.csproj --configuration Release --no-build `
          --logger "trx;LogFileName=mcp-unit-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          ./TestResults/*.trx
          ./TestResults/**/coverage.cobertura.xml
        retention-days: 30

    - name: Generate unit test report
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: Unit Test Results
        path: ./TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore clif.sln

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run integration tests
      id: integration-tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "FullyQualifiedName~Integration" `
          --logger "trx;LogFileName=integration-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults
      continue-on-error: true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          ./TestResults/*.trx
          ./TestResults/**/coverage.cobertura.xml
        retention-days: 30

    - name: Generate integration test report
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: Integration Test Results
        path: ./TestResults/integration-tests.trx
        reporter: dotnet-trx
        fail-on-error: false

    - name: Integration test outcome summary
      if: always()
      shell: pwsh
      run: |
        if ("${{ steps.integration-tests.outcome }}" -eq "failure") {
          Write-Host "::warning::Integration tests had failures. This is expected in headless CI environments where UI automation APIs are unavailable."
          Write-Host "Integration tests require a full Windows desktop session with UI Automation support."
          Write-Host "For full validation, run integration tests locally with TestWpfApp running."
        } else {
          Write-Host "Integration tests passed successfully."
        }

  # ────────────────────────────────────────────────────────────────────────────
  # WPF UI Tests
  # Launches TestWpfApp.exe and exercises it end-to-end via FlaUI / UIA3.
  # windows-latest runners provide a full interactive desktop session so WPF
  # windows and UI Automation are available.  continue-on-error is set to true
  # because the job is informational for PRs; failures are surfaced as warnings.
  # ────────────────────────────────────────────────────────────────────────────
  wpf-ui-tests:
    name: WPF UI Tests
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore clif.sln

    # Rebuild is required because .NET build outputs contain absolute paths and
    # cannot be reliably shared between jobs via artifacts on Windows runners.
    - name: Build solution
      run: dotnet build clif.sln --configuration Release --no-restore

    - name: Run WPF UI tests
      id: wpf-ui-tests
      run: |
        dotnet test CLIF.Tests/CLIF.Tests.csproj --configuration Release --no-build `
          --filter "Category=WpfUI" `
          --logger "trx;LogFileName=wpf-ui-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults
      continue-on-error: true

    - name: Upload WPF UI test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wpf-ui-test-results
        path: ./TestResults/*.trx
        retention-days: 30

    - name: Generate WPF UI test report
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: WPF UI Test Results
        path: ./TestResults/wpf-ui-tests.trx
        reporter: dotnet-trx
        fail-on-error: false

    - name: WPF UI test outcome summary
      if: always()
      shell: pwsh
      run: |
        if ("${{ steps.wpf-ui-tests.outcome }}" -eq "failure") {
          Write-Host "::warning::WPF UI tests had failures."
          Write-Host "Ensure TestWpfApp builds successfully and the runner has a desktop session with UI Automation support."
          Write-Host "Set the TEST_WPF_APP_PATH environment variable to override the TestWpfApp binary location."
        } else {
          Write-Host "WPF UI tests passed successfully."
        }
